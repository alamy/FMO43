<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script>
    // Proteção de acesso: só permite acesso se usuário fez login
    if (!localStorage.getItem('fmo43_autenticado')) {
      window.location.href = 'index.html';
    }
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pílula de Sabedoria - FMO43</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        background: #181a20;
        color: #f1f1f1;
      }
      .container, .card, .content {
        background: #23242b !important;
        color: #f1f1f1 !important;
        border-radius: 18px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.25);
      }
      .bottom-nav {
        background: #23242b;
        border-top: 1.5px solid #222;
        box-shadow: 0 -2px 16px rgba(0,0,0,0.25);
      }
      .bottom-nav a {
        color: #fbc02d;
        transition: color 0.2s;
      }
      .bottom-nav a.active, .bottom-nav a:hover {
        color: #1976d2;
      }
      .material-icons {
        color: #fbc02d;
      }
      h1, h2, h3, h4, h5, h6 {
        color: #fbc02d;
      }
    </style>
</head>
<body>
    <header style="background:#1976d2;color:#fff;padding:16px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
        <img src="img/logo.png" alt="Logo" style="height:40px;vertical-align:middle;">
        <span style="font-size:1.3rem;font-weight:600;vertical-align:middle;margin-left:8px;">Pílula de Sabedoria</span>
    </header>
  <main class="container" style="margin-top:20px;margin-bottom:90px;">
    <div id="pilula-dia" class="card mb-3" style="display:none;">
      <div class="card-body">
        <h5 class="card-title" id="pilula-titulo"></h5>
        <p class="card-text" id="pilula-mensagem"></p>
      </div>
    </div>
    <div id="pilula-erro" style="display:none;color:#c00;text-align:center;margin-top:32px;">Não foi possível carregar a pílula de sabedoria.</div>
  </main>
    <nav class="bottom-nav">
      <nav class="bottom-nav" id="bottom-nav">
        <a href="Home.html" class="nav-item" id="menu-home">
          <span class="material-icons">home</span>
        </a>
        <a href="https://drive.google.com/drive/folders/14IHt5NGieyxh2Mxb1N6gRFHF_065JTsP?usp=drive_link" class="nav-item" id="menu-biblioteca" target="_blank" rel="noopener noreferrer">
          <span class="material-icons">menu_book</span>
        </a>
        <a href="pilula.html" class="nav-item active" id="menu-pilula">
          <span class="material-icons">lightbulb</span>
        </a>
      </nav>
      <script>
      // Exibe o menu Dashboard apenas para Mestre
      document.addEventListener('DOMContentLoaded', function() {
        const cim = localStorage.getItem('fmo43_cim');
        if (cim) {
          fetch('usuarios.json')
            .then(r => r.json())
            .then(usuarios => {
              const usuario = usuarios.find(u => u.CIM === cim);
              if (usuario && usuario.Grau === 'Mestre') {
                const nav = document.getElementById('bottom-nav');
                const dash = document.createElement('a');
                dash.href = 'dashboard.html';
                dash.className = 'nav-item';
                dash.id = 'menu-dashboard';
                dash.innerHTML = '<span class="material-icons">dashboard</span>';
                nav.appendChild(dash);
              }
            });
        }
      });
      </script>
</body>
<script src="pilula.js"></script>
</html>
