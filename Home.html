
<!DOCTYPE html>
<html lang="pt-br">
<head>
	<script>
		// Proteção de acesso: só permite acesso se usuário fez login
		if (!localStorage.getItem('fmo43_autenticado')) {
			window.location.href = 'index.html';
		}
	</script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Rede Social FMO43</title>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
			<link rel="stylesheet" href="styles.css">
			<style>
				body {
					background: #181a20;
					color: #f1f1f1;
				}
				.container, .feed-card, .content {
					background: #23242b !important;
					color: #f1f1f1 !important;
					border-radius: 18px;
					box-shadow: 0 4px 32px rgba(0,0,0,0.25);
				}
				.bottom-nav {
					background: #23242b;
					border-top: 1.5px solid #222;
					box-shadow: 0 -2px 16px rgba(0,0,0,0.25);
				}
				.bottom-nav a {
					color: #fbc02d;
					transition: color 0.2s;
				}
				.bottom-nav a.active, .bottom-nav a:hover {
					color: #1976d2;
				}
				.material-icons {
					color: #fbc02d;
				}
				h1, h2, h3, h4, h5, h6 {
					color: #fbc02d;
				}
			</style>
</head>
<body>
		<!-- Header -->
		<header style="background:#1976d2;color:#fff;padding:16px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);position:relative;">
			<img src="img/logo.png" alt="Logo" style="height:40px;vertical-align:middle;">
			<span style="font-size:1.3rem;font-weight:600;vertical-align:middle;margin-left:8px;">FMO43 Social</span>
			<span id="saudacao-nome" style="display:block;font-size:1.08rem;font-weight:500;margin-top:6px;"></span>
			<button id="logout-btn" title="Sair" style="position:absolute;top:10px;right:12px;background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;opacity:0.6;z-index:10;line-height:1;">
				<span class="material-icons" style="font-size:1.5rem;">close</span>
			</button>
		</header>
<script>
// Logout discreto
document.getElementById('logout-btn').onclick = function() {
	localStorage.removeItem('fmo43_autenticado');
	localStorage.removeItem('fmo43_cim');
	window.location.href = 'index.html';
};
</script>

		<!-- Feed -->
		<main id="feed" class="container" style="margin-top:20px;margin-bottom:90px;">
		<!-- Feed será carregado dinamicamente por feed.js -->
		<div id="feed-cards"></div>
		<div class="card mb-3" id="pilula-card">
			<div class="card-body">
				<h5 class="card-title">Pílula do Dia</h5>
				<p class="card-text" id="pilula-text">Carregando...</p>
			</div>
		</div>
				</main>
				<script src="feed.js"></script>
				<script>
				// Função para calcular o tempo relativo (ex: "há 2 horas", "há 1 dia")
				function tempoRelativo(datahora) {
					const agora = new Date();
					const data = new Date(datahora);
					const diffMs = agora - data;
					const diffMin = Math.floor(diffMs / 60000);
					if (diffMin < 60) return `há ${diffMin} min`;
					const diffH = Math.floor(diffMin / 60);
					if (diffH < 24) return `há ${diffH} horas`;
					const diffD = Math.floor(diffH / 24);
					return `há ${diffD} dia${diffD > 1 ? 's' : ''}`;
				}

				// Renderiza o feed dinamicamente
				function renderFeed() {
					const feedCards = document.getElementById('feed-cards');
					feedCards.innerHTML = '';
					(window.feed || []).forEach(item => {
						const card = document.createElement('div');
						card.className = 'card mb-3';
						card.innerHTML = `
							<div class="card-body">
								<h5 class="card-title">${item.titulo}</h5>
								<p class="card-text">${item.texto}</p>
								<small class="text-muted">${tempoRelativo(item.datahora)}</small>
							</div>
						`;
						feedCards.appendChild(card);
					});
				}
				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', renderFeed);
				} else {
					renderFeed();
				}

				// Exibe a pílula do dia na Home
				fetch('pilula.json')
					.then(r => r.json())
					.then(pilulas => {
						// Seleção baseada no dia do ano
						const hoje = new Date();
						const diaAno = Math.floor((hoje - new Date(hoje.getFullYear(), 0, 0)) / 86400000);
						const pilula = pilulas[diaAno % pilulas.length];
						document.getElementById('pilula-text').textContent = pilula.Mensagem;
					})
					.catch(() => {
						document.getElementById('pilula-text').textContent = 'Não foi possível carregar a pílula.';
					});
				</script>

			<!-- Menu fixo no rodapé com botão central destacado -->
			<nav class="bottom-nav" id="bottom-nav">
				<a href="#" class="nav-item active" id="menu-home">
					<span class="material-icons">home</span>
				</a>
				<a href="https://drive.google.com/drive/folders/14IHt5NGieyxh2Mxb1N6gRFHF_065JTsP?usp=drive_link" class="nav-item" id="menu-biblioteca" target="_blank" rel="noopener noreferrer">
					<span class="material-icons">menu_book</span>
				</a>
				<a href="pilula.html" class="nav-item" id="menu-pilula">
					<span class="material-icons">lightbulb</span>
				</a>
			</nav>
			<script>
			// Exibe o menu Dashboard apenas para Mestre
			document.addEventListener('DOMContentLoaded', function() {
				const cim = localStorage.getItem('fmo43_cim');
				if (cim) {
					fetch('usuarios.json')
						.then(r => r.json())
						.then(usuarios => {
							const usuario = usuarios.find(u => u.CIM === cim);
							if (usuario && usuario.Grau === 'Mestre') {
								const nav = document.getElementById('bottom-nav');
								const dash = document.createElement('a');
								dash.href = 'dashboard.html';
								dash.className = 'nav-item';
								dash.id = 'menu-dashboard';
								dash.innerHTML = '<span class="material-icons">dashboard</span>';
								nav.appendChild(dash);
							}
						});
				}
			});
			</script>
<script>
// Exibe saudação personalizada se CIM informado
document.addEventListener('DOMContentLoaded', function() {
	const cim = localStorage.getItem('fmo43_cim');
	if (cim) {
		fetch('usuarios.json')
			.then(r => r.json())
			.then(usuarios => {
				const usuario = usuarios.find(u => u.CIM === cim);
				if (usuario && usuario.nome) {
					document.getElementById('saudacao-nome').textContent = 'Olá, ' + usuario.nome;
				}
			});
	}
});
</script>
</body>
</html>
