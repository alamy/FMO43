<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Biblioteca - FMO43</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        background: #181a20;
        color: #f1f1f1;
      }
      .container, .content {
        background: #23242b !important;
        color: #f1f1f1 !important;
        border-radius: 18px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.25);
      }
      .bottom-nav {
        background: #23242b;
        border-top: 1.5px solid #222;
        box-shadow: 0 -2px 16px rgba(0,0,0,0.25);
      }
      .bottom-nav a {
        color: #fbc02d;
        transition: color 0.2s;
      }
      .bottom-nav a.active, .bottom-nav a:hover {
        color: #1976d2;
      }
      .material-icons {
        color: #fbc02d;
      }
      h1, h2, h3, h4, h5, h6 {
        color: #fbc02d;
      }
    </style>
</head>
<body>
    <header style="background:#1976d2;color:#fff;padding:16px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04);">

        <span style="font-size:1.3rem;font-weight:600;vertical-align:middle;margin-left:8px;">Biblioteca</span>
    </header>
    <main class="container" style="margin-top:20px;margin-bottom:90px;">
        <div class="card mb-3">

      <a href="Home.html" class="nav-item" id="menu-home">

      </a>
      <a href="biblioteca.html" class="nav-item active" id="menu-biblioteca">
        <span class="material-icons">menu_book</span>
      </a>
      <a href="pilula.html" class="nav-item" id="menu-pilula">
