<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual de Aprendiz</title>
<style>
  /* Reset e base */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    color: #333;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
    flex-shrink: 0;
    font-size: 1.2em;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: #ecf0f1;
    border-bottom: 1px solid #ccc;
    flex-shrink: 0;
  }

  .tab-button {
    flex: 1;
    padding: 12px;
    border: none;
    background: #ecf0f1;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }

  .tab-button.active {
    background: #fff;
    border-bottom: 2px solid #2c3e50;
  }

  /* Container principal */
  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* Menu lateral */
  aside {
    width: 250px;
    background: #fff;
    border-right: 1px solid #ccc;
    overflow-y: auto;
    padding: 10px;
    transition: transform 0.3s ease;
  }

  aside button {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    background: #f1f1f1;
    border: none;
    text-align: left;
    cursor: pointer;
    transition: background 0.3s;
  }

  aside button:hover {
    background: #dcdcdc;
  }

  /* Conteúdo */
  #conteudo {
    flex: 1;
    padding: 20px;
    background: #fff;
    overflow-y: auto;
  }

  #conteudo h2 {
    margin-bottom: 15px;
  }
  #conteudo ol {
    margin-left: 20px;
  }

  /* Botão menu toggle mobile */
  #menu-toggle {
    display: none;
    position: absolute;
    top: 10px;
    left: 10px;
    background: #2c3e50;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    z-index: 10;
    border-radius: 5px;
  }

  /* Responsivo para mobile */
  @media (max-width: 768px) {
    aside {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 9;
      transform: translateX(-100%);
      box-shadow: 2px 0 5px rgba(0,0,0,0.3);
    }

    aside.open {
      transform: translateX(0);
    }

    #menu-toggle {
      display: block;
    }
  }

  .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #c0b298;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        h1, h2 {
            font-family: 'Times New Roman', Times, serif;
            color: #4b3824;
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 20px;
        }
        .question-block {
            background-color: #f9f7f4;
            border: 1px solid #e0d8c9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .dialogue-pair {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .speaker {
            font-weight: bold;
            color: #6a0e1c;
            display: block;
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        .question {
            font-style: italic;
            color: #3b5998;
            margin-left: 20px;
        }
        .answer {
            color: #2f4f4f;
            margin-left: 40px;
        }
        .separator {
            text-align: center;
            margin: 40px 0;
            color: #a0a0a0;
        }
</style>
</head>
<body>
  <header>
    📜 Ritual de Aprendiz
  </header>

  <button id="menu-toggle">☰</button>

  <div class="container">
    <aside id="menu"></aside>
    <section id="conteudo" style="padding:  20px 19px;">
      <article style="text-align: center; margin-top: 170px;">

 <h2>A∴R∴L∴S∴F∴M∴O∴43 </h2>

<p>

<i>Or∴ de Recife - Pernambuco – Brasil</i>
      </article>        
    </section>
  </div>

<script>
let jsonData = null;
let currentTab = "capitulos";

async function loadData() {
  try {
    const res = await fetch("ritual_indice_conteudo_final.json");
    jsonData = await res.json();
    renderMenu();
  } catch (err) {
    console.error("Erro ao carregar JSON:", err);
  }
}

function renderMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  const items = jsonData[currentTab];
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = `${item.id}. ${item.titulo}`;
    btn.onclick = () => showContent(item);
    menu.appendChild(btn);
  });
}

function showContent(item) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = `
    <h2>${item.titulo}</h2>
    <div>${item.conteudo}</div>
  `;
  // Fecha o menu no mobile após selecionar
  document.getElementById("menu").classList.remove("open");
}

// Trocar de abas
document.addEventListener("DOMContentLoaded", () => {
  loadData();

  document.querySelectorAll(".tab-button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      renderMenu();
      document.getElementById("conteudo").innerHTML = `
       <h2>A∴R∴L∴S∴F∴M∴O∴43 </h2>
<h3>Fundada em 23 de Agosto de 2007</h3>
<p>
RITUAL
DO APRENDIZ MAÇOM</p>


<p>Segundo</p>


<i>FRIEDRICH LUDWIG SCHRÖDER</i>



<p>
EDIÇÃO
2025 </p>




<i>Or∴ de Recife - Pernambuco – Brasil</i>
      `;
    });
  });

  // Toggle menu mobile
  document.getElementById("menu-toggle").addEventListener("click", () => {
    document.getElementById("menu").classList.toggle("open");
  });
});
</script>
</body>
</html>
