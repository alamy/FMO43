<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMO43 - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
    <style>
      body {
        background: #181a20;
        color: #f1f1f1;
      }
    </style>
</head>
<body class="text-center">
  <form class="form-signin" id="loginForm" autocomplete="off">
    <img class="mb-4" src="img/logo.png" alt="Logo" width="72" height="72">
    <h1 class="h3 mb-3 font-weight-normal">Seja Bem-vindo</h1>
    <label for="palavra" class="sr-only">Palavra-passe</label>
    <input type="password" id="palavra" class="form-control" placeholder="Digite a palavra secreta" required>
    <button class="btn btn-lg btn-primary btn-block" type="submit" id="enviar">Entrar</button>
    <p class="mt-5 mb-3 text-muted">&copy; 2017-2025</p>
  </form>
  <script>
    // Palavra-passe válida
    const palavraCorreta = 'Jaquim';
    function verificarLogin(event) {
      event.preventDefault();
      const palavra = document.getElementById('palavra').value;
      if (palavra === palavraCorreta) {
        localStorage.setItem('fmo43_autenticado', '1');
        window.location.href = 'Home.html';
      } else {
        alert('Palavra-passe incorreta');
      }
    }
    document.getElementById('loginForm').addEventListener('submit', verificarLogin);
  </script>
</body>
</html>
